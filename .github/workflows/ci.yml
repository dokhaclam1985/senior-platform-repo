
name: Senior Platform CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  # =====================================
  # Express API CI
  # =====================================
  express-api:
    name: Express API - CI
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: express-senior-demo

    steps:
      # 1. Checkout source code
      - name: Checkout source code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: express-senior-demo/package-lock.json

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. TypeScript validation
      - name: Check TypeScript
        run: npx tsc --noEmit

      # 5. Build JavaScript into dist/
      - name: Build Express API
        run: npx tsc

      # 6. Run Jest automated tests
      - name: Run Automated Tests
        run: npm test -- --runInBand

      # 7. Audit production dependencies
      - name: Security Audit
        run: npm audit --omit=dev

  # =====================================
  # Next.js Web CI
  # =====================================
  nextjs-web:
    name: Next.js Web - CI
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: nextjs-senior-demo

    steps:
      # 1. Checkout source code
      - name: Checkout source code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: nextjs-senior-demo/package-lock.json

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. TypeScript validation
      - name: Check TypeScript
        run: npx tsc --noEmit

      # 5. Audit production dependencies
      - name: Security Audit
        run: npm audit --omit=dev

      # 6. Next.js production build
      - name: Production Build
        run: npm run build
