
name: Senior Platform CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  # =====================================
  # Express API CI
  # =====================================
  express-api:
    name: Express API - CI
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: express-senior-demo

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: express-senior-demo/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript
        run: npx tsc --noEmit

      # Build TypeScript for tests using dist/
      - name: Build Express API
        run: npx tsc

      # Automated Jest Security Tests
      - name: Run Automated Tests
        run: npm test -- --runInBand

      - name: Security Audit
        run: npm audit --omit=dev

  # =====================================
  # Next.js Web CI
  # =====================================
  nextjs-web:
    name: Next.js Web - CI
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: nextjs-senior-demo

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: nextjs-senior-demo/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript
        run: npx tsc --noEmit

      - name: Security Audit
        run: npm audit --omit=dev

      - name: Production Build
        run: npm run build
