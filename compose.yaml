services:
  postgres:
    image: postgres:17-alpine
    container_name: senior-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    mem_limit: 512m
    cpus: 1.0

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  api:
    build:
      context: ./express-senior-demo

    container_name: senior-api
    restart: unless-stopped

    command: >
      sh -c "npm run migrate:up && node dist/server.js"

    ports:
      - "${API_PORT}:8080"

    environment:
      NODE_ENV: production
      PORT: 8080

      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}

      CORS_ORIGIN: ${CORS_ORIGIN}

      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}

      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

    mem_limit: 512m
    cpus: 1.0

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:8080/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s


  web:
    build:
      context: ./nextjs-senior-demo

    container_name: senior-web
    restart: unless-stopped

    ports:
      - "${WEB_PORT}:3000"

    environment:
      NODE_ENV: production
      API_BASE_URL: http://api:8080

    mem_limit: 512m
    cpus: 1.0

    depends_on:
      api:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s


  prometheus:
    image: prom/prometheus:latest
    container_name: senior-prometheus
    restart: unless-stopped

    ports:
      - "9090:9090"

    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

    mem_limit: 256m
    cpus: 0.5

    depends_on:
      api:
        condition: service_healthy


  grafana:
    image: grafana/grafana:latest
    container_name: senior-grafana
    restart: unless-stopped

    ports:
      - "3001:3000"

    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}

    volumes:
      - grafana_data:/var/lib/grafana

    mem_limit: 256m
    cpus: 0.5

    depends_on:
      - prometheus


volumes:
  postgres_data:
  prometheus_data:
  grafana_data: